# Despliegue en Render (Blueprint): New + > Blueprint > elegir este repositorio.
services:
  - type: web
    name: creditos-vehiculares
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir tablero app:server --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
